# Analisi statica di sicurezza (SAST) del codice TypeScript con CodeQL: XSS, SQL injection, redirect aperti,
# segreti scritti nel codice e simili. Gratis sui repository pubblici; i risultati sono in GitHub → Security →
# Code scanning. Gira a ogni push su main, sulle pull request e una volta a settimana con le regole aggiornate.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1" # lunedì notte

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Regole di sicurezza estese, oltre a quelle predefinite.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
